name: brats24_sagittal_fold1_VSS_tbptt
data_root: /home/aurora/data/BRATS2024_preprocessed/BraTS2024TrainingData
label_format: brats24
val_fold: 1
view: sagittal
# model architecture
model: VSS  # VSS: 3 stages; VSS_deep: 4 stages
patch_size: 2
stage_depths: [2, 2, 2]  # VSS: 3 stages; VSS_deep: 4 stages
linear_projection: true
residual_connections: true
dwconv2d_spiking: false
patch_embedding_spiking: false
input_skip: false  # orig only: input 4->8 projection + full-resolution 3x3 fusion
# training
# Set this to an existing run directory to resume from checkpoint_last.pt.
resume_from: experiments/brats24_sagittal_fold1_VSS_tbptt_20260915_133521
# true restores the checkpoint scheduler; false starts it from the checkpoint LR.
resume_scheduler: false
scheduler: reduce_plateau  # cosine or reduce_plateau
# Optional lossless uint8 cache built with build_brats_cache.py.
cache_root: /home/aurora/data/BRATS2024_subject_cache
cache_required: true
loader_workers: 2          # one GPU; applies to both train and validation loaders
loader_prefetch_factor: 1  # subjects are large, so keep RAM usage bounded
batch_size_subjects: 8
lr: 0.001
epochs: 250
weight_decay: 0.00001
grad_clip: 0.3
use_fptt: true  # false = plain TBPTT; FPTT hyperparameters are ignored
tbptt_k: 1
alpha_fptt: 0.1
beta_fptt: 0.15
rho_fptt: 0.0
lambda_fptt: 1.5
lambda_bce: 0.5
lambda_dice: 0.5
loss_function: "bce_dice"  # bce_dice or wbce_fdice
size_aware_bce:
  gamma: 0.5
  max_weight: 5.0
  eps: 1.0
foreground_dice:
  eps: 1.0e-6
eval_every: 1
eval_batch_slices: 16
prob_threshold: 0.5
subjects_per_fold: 20  # null/commented = use all subjects; otherwise first n per train/val fold
# overfit_subjects: 5
