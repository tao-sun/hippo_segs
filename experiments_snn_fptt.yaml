name: brats24_sagittal_fold1_VSS_fptt
data_root: /gpfs/scratch1/shared/apiaghiardelli/data/BRATS2024_preprocessed
cache_root: /gpfs/scratch1/shared/apiaghiardelli/data/BRATS2024_subject_cache_zscore_trainonly
cache_required: true
label_format: brats24
val_fold: 1
view: sagittal
model: orig
# model architecture
neuron_model: plif  # plif or silif; existing spiking switches select active positions
hierarchical_encoder: true  # false reconstructs original Arch 2 / old checkpoints
stem_depth: 1
stem_spiking: true  # spiking neuron in each stem ConvBlock
downsampling_spiking: true  # spiking neuron after downsampling Conv2D + GroupNorm
stem_channels: 32
encoder_channels: [64, 128, 256]
downsample_kernel_size: 3
downsample_strides: [2, 2, 2]  # per-stage strides; [1, 2, 2] preserves full resolution in stage 1
dwconv2d_kernel_size: 3  # spatial depthwise inside every Mamba block; positive odd (3, 5, 7, ...)
vss_depths: [1, 1, 2]
full_resolution_skip: true
final_skip_fusion: concat
decoder_block: standard  # standard or resdecoder; neurons follow output_spiking
resdecoder_spiking1: true  # after the first Conv3x3 + GN
resdecoder_spiking2: true  # after the residual sum + GN
fue_skip1: false  # encoder stage 1 -> decoder concat2_conv
fue_skip2: false  # encoder stage 2 -> decoder concat1_conv
patch_size: 2
linear_projection: true
residual_connections: true
dwconv2d_spiking: true
patch_embedding_spiking: true
output_spiking: true  # output neurons in VSS and every decoder stage
temporal_mamba:
  enabled: false
  kernel_size: 3
  d_state: 16
  dt_rank: auto
  debug_shapes: false
input_skip: false  # orig only: input 4->8 projection + full-resolution 3x3 fusion
# training
# Set this to an existing run directory to resume from checkpoint_last.pt.
resume_from: null
# true restores the checkpoint scheduler; false starts it from the checkpoint LR.
resume_scheduler: false
scheduler: reduce_plateau  # cosine or reduce_plateau
# Independent ablations: minmax/false reproduces the old input and sampling.
preprocessing_normalization: zscore  # zscore requires a new float32 cache
preserve_float32: true             # true with zscore
lesion_volume_sampling: false
lesion_sampling_classes: [ET, TC]
lesion_sampling_gamma: 0.5
lesion_sampling_max_weight: 4.0
# Cache from build_brats_cache.py (legacy) or data/preprocess_brats24.py.

loader_workers: 2          # one GPU; applies to both train and validation loaders
loader_prefetch_factor: 1  # subjects are large, so keep RAM usage bounded
batch_size_subjects: 8
lr: 0.001
epochs: 100
weight_decay: 0.00001
grad_clip: 0.3
use_fptt: true  # false = plain TBPTT; FPTT hyperparameters are ignored
tbptt_k: 1
alpha_fptt: 0.1
beta_fptt: 0.15
rho_fptt: 0.0
lambda_fptt: 1.5
lambda_bce: 0.5
lambda_dice: 0.5
loss_function: "bce_dice"  # bce_dice or wbce_fdice
size_aware_bce:
  gamma: 0.5
  max_weight: 5.0
  eps: 1.0
foreground_dice:
  eps: 1.0e-6
eval_every: 1
eval_batch_slices: 16
prob_threshold: 0.5
# Applied only to thresholded prediction volumes; ground truth is untouched.
apply_postprocessing: true
# ET, TC, WT minimum connected-component sizes in voxels.
min_component_sizes: [161, 166, 50]
closing_radius: 1
subjects_per_fold: 20 # null/commented = use all subjects; otherwise first n per train/val fold
# overfit_subjects: 5
