# Supported families: unet2d, unet3d, snn. Use a fresh run_dir for every run.
family: snn
dataset_id: 1
fold: 0
gpus: 1
run_dir: /gpfs/scratch1/shared/apiaghiardelli/SNNMamba_k8_silif

snn:
  variant: orig
  epochs: 600  # total training epochs
  lr: 0.001  # initial learning rate for optimizer and polynomial scheduler
  training_patch_size: [162, 128, 128]  # spatial patch in preprocessed axis order
  validation_every: 50  # full fold validation with postprocessing at epochs 50, 100, ...
  validation_patch_size: [162, 128, 128]  # full temporal extent on saved axis 0
  temporal_axis: 0
  k: 4
  use_fptt: true
  # Each disabled spiking activation uses GELU; prediction heads keep raw logits.
  output_spiking: true  # output neurons in VSS and decoder; both neurons in ResDecoder
  spatial_mamba:
    neuron_model: silif  # plif or silif; existing spiking switches select active positions
    # Used only by SiLIF; printed in the SLURM .out and saved for inference.
    # Initial ranges for learned per-channel parameters; a/b retain clamps [0,1]/[0,2].
    silif:
      v_threshold: 1.0       # fixed spike threshold; try 0.8 for a sensitivity ablation
      dt_init: 0.004        # learned timestep; keep fixed when comparing rate_u
      rate_u_range: [10.0, 250.0]  # faster membrane: [15, 375] (x1.5)
      rate_w_range: [2.5, 10.0]    # larger rates shorten adaptation persistence
      a_range: [0.0, 1.0]   # initial membrane feedback; weaker: [0, 0.5]
      b_range: [0.0, 2.0]   # initial spike feedback; weaker: [0, 1]
      surrogate_alpha: 2.0  # ATan gradient slope; compare 1, 2, 4
      detach_reset: true   # gradient through membrane reset is detached
    hierarchical_encoder: true
    stem_depth: 1
    stem_spiking: true  # spiking neuron in each stem ConvBlock
    downsampling_spiking: true  # spiking neuron after downsampling Conv2D + GroupNorm
    stem_channels: 32
    encoder_channels: [64, 128, 256]
    downsample_kernel_size: 3
    downsample_strides: [2, 2, 2]  # stride of each encoder stage; [2, 2, 2] restores the original /8 scale
    dwconv2d_kernel_size: 5  # spatial depthwise inside every Mamba block; positive odd (3, 5, 7, ...)
    vss_depths: [1, 1, 1]
    full_resolution_skip: true
    final_skip_fusion: concat
    decoder_block: standard  # standard or resdecoder; first two decoder skip fusions
    resdecoder_spiking1: false  # after the first Conv3x3 + GN
    resdecoder_spiking2: false  # after the residual sum + GN
    fue_skip1: false  # encoder stage 1 -> decoder concat2_conv
    fue_skip2: false  # encoder stage 2 -> decoder concat1_conv
    patch_embedding_spiking: true
    dwconv2d_spiking: true
  temporal_mamba:
    enabled: false
    kernel_size: 3
    d_state: 16
    dt_rank: auto
    debug_shapes: false
    norm_spiking: false  # PLIF after temporal normalization
    dwconv1D_spiking: false  # PLIF after temporal depthwise Conv1D
