[project]
name = "hippo-segs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "auryghia", email = "auryghia05@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate>=1.10,<2",
    "mamba-ssm",
    "matplotlib>=3.9.4",
    "nibabel>=5.3.3",
    "nnunetv2==2.8.1",
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pyyaml>=6.0.3",
    "scipy>=1.11",
    "scikit-learn>=1.6.1",
    "synapseclient>=4.10.0",
    "torch==2.5.1",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.20.1",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
package = true

[tool.uv.sources]
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.2.6.post3/mamba_ssm-2.2.6.post3%2Bcu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snn_nnunet"]
py-modules = ["model", "spike_neurons", "spikmamba", "surrogate"]
